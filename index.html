<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini GraphQL App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input { padding: 10px; margin-bottom: 10px; display: block; width: 100%; max-width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        .status { color: #d9534f; font-weight: bold; margin-bottom: 10px; }
        .success { color: #28a745; }

        /* Cards and Tables Styles */
        .hashtags-container { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
        .hashtag-card { background: #e0ebff; border: 1px solid #b3ccff; padding: 15px; border-radius: 8px; text-align: center; flex: 1; min-width: 120px; }
        .hashtag-card h3 { margin: 0 0 5px 0; color: #004085; }
        .hashtag-card span { font-size: 14px; color: #666; }
        
        .styled-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .styled-table th, .styled-table td { border: 1px solid #ddd; padding: 10px; text-align: left; } /* Changed to left */
        .styled-table th { background-color: #f8f9fa; color: #333; }
        
        .posts-list { margin-top: 15px; padding-left: 20px; } /* Changed to padding-left */
        .posts-list li { margin-bottom: 8px; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h1>GraphQL API Testing Interface</h1>

    <!-- Hashtags Section -->
    <div class="card">
        <h2>1. Popular Hashtags (Public Data)</h2>
        <button onclick="fetchHashtags()">Fetch Hashtags</button>
        <div id="hashtags-result"></div>
    </div>

    <!-- Login Section -->
    <div class="card">
        <h2>2. Login (To Get Token)</h2>
        <div id="login-status" class="status">You are not logged in currently.</div>
        <input type="text" id="username" placeholder="Username (admin)" value="admin">
        <input type="password" id="password" placeholder="Password (123456)" value="123456">
        <button onclick="login()">Login</button>
    </div>

    <!-- Private Data Section -->
    <div class="card">
        <h2>3. My Private Data (Requires Login)</h2>
        <button id="private-btn" onclick="fetchPrivateData()" disabled>Fetch Posts and Followers</button>
        <div id="private-result" style="margin-top: 15px;">Please login first to fetch this data...</div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8000/index.php';
    let currentToken = null;

    async function fetchGraphQL(query, variables = {}) {
        const headers = { 'Content-Type': 'application/json' };
        if (currentToken) { headers['Authorization'] = `Bearer ${currentToken}`; }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ query: query, variables: variables })
            });
            return await response.json();
        } catch (error) {
            return { error: error.message };
        }
    }

    /**
     * 1. Fetch and Display Hashtags
     */
    async function fetchHashtags() {
        const query = `
            query {
                popularHashtags { name usage_count }
            }
        `;
        const result = await fetchGraphQL(query);
        const container = document.getElementById('hashtags-result');
        
        if (result.data && result.data.popularHashtags) {
            let html = '<div class="hashtags-container">';
            result.data.popularHashtags.forEach(tag => {
                html += `
                    <div class="hashtag-card">
                        <h3>${tag.name}</h3>
                        <span>Used ${tag.usage_count} times</span>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        } else {
            container.innerHTML = `<p style="color:red;">Error fetching data.</p>`;
        }
    }

    /**
     * 2. Login
     */
    async function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const statusDiv = document.getElementById('login-status');
        
        const mutation = `mutation { login(username: "${user}", password: "${pass}") }`;
        const result = await fetchGraphQL(mutation);
        
        if (result.data && result.data.login) {
            currentToken = result.data.login;
            statusDiv.textContent = "Login successful!";
            statusDiv.className = "status success";
            document.getElementById('private-btn').disabled = false;
            document.getElementById('private-result').innerHTML = ""; // Clear warning message
        } else {
            statusDiv.textContent = "Login failed.";
            statusDiv.className = "status";
        }
    }

    /**
     * 3. Fetch Posts and Followers
     */
    async function fetchPrivateData() {
        const query = `
            query {
                myPosts { title }
                myLastFollowers { follower_name created_at }
            }
        `;
        const result = await fetchGraphQL(query);
        const container = document.getElementById('private-result');
        
        if (result.data) {
            let html = '';

            // Posts List
            html += '<h3>📋 My Recent Posts:</h3>';
            html += '<ul class="posts-list">';
            result.data.myPosts.forEach(post => {
                html += `<li>${post.title}</li>`;
            });
            html += '</ul>';

            // Followers Table
            html += '<h3>👥 Recent Followers:</h3>';
            html += `
                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>Follower Name</th>
                            <th>Date Followed</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            result.data.myLastFollowers.forEach(follower => {
                html += `
                    <tr>
                        <td>${follower.follower_name}</td>
                        <td>${follower.created_at}</td>
                    </tr>
                `;
            });
            html += '</tbody></table>';

            container.innerHTML = html;
        } else {
            container.innerHTML = `<p style="color:red;">Unauthorized to fetch data.</p>`;
        }
    }
</script>

</body>
</html>
